<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Claude Code Web Terminal</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#05070d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Claude"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png"><style>:root{color-scheme:dark;--toolbar-height:42px;--input-height:72px}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05070d;color:#d8dee9;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#toolbar{position:fixed;top:0;left:0;right:0;min-height:var(--toolbar-height);z-index:5;display:flex;gap:6px;align-items:center;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;border-bottom:1px solid rgba(148,163,184,.2);background:rgba(15,23,42,.96)}button{min-height:30px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800}#status{min-width:0;flex:1;color:#94a3b8;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#viewer{position:fixed;inset:var(--toolbar-height) 0 var(--input-height) 0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#05070d}#output{margin:0;min-height:100%;padding:10px 14px 24px;white-space:normal;overflow-wrap:anywhere;word-break:break-word;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.line{display:block;min-height:1.45em;white-space:pre-wrap}.user-line{margin:2px -6px;padding:2px 6px 2px 9px;border-left:3px solid #38bdf8;border-radius:6px;background:rgba(14,165,233,.13);color:#7dd3fc;font-weight:800}#inputbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:minmax(0,1fr) 68px;gap:8px;align-items:stretch;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));border-top:1px solid rgba(148,163,184,.22);background:rgba(15,23,42,.98)}#message{min-height:46px;max-height:30vh;resize:none;padding:12px 14px;border:1px solid rgba(96,165,250,.42);border-radius:14px;background:#020617;color:#f8fafc;font:16px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;outline:none}#send{min-height:46px;border-radius:14px}</style></head><body><div id="toolbar"><button id="bottom">Cuối</button><span id="status">Đang nối viewer...</span></div><div id="viewer"><pre id="output">Đang tải nội dung Claude Code...</pre></div><div id="inputbar"><textarea id="message" rows="1" autocomplete="off" autocorrect="on" autocapitalize="sentences" spellcheck="true" enterkeyhint="send" placeholder="Nhập text rồi bấm Gửi"></textarea><button id="send">Gửi</button></div><script>console.log('Reference UI shell. Wire input to ttyd via your deployed index patch.');if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{scope:'/claude/'}).catch(function(e){console.warn('SW register failed',e);});});}</script></body></html>
