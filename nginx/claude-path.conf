# Put this inside your HTTPS server block.
location = /claude { return 301 /claude/; }
location = /claude/manifest.webmanifest { alias /usr/local/share/claude-code-ttyd/manifest.webmanifest; default_type application/manifest+json; add_header Cache-Control "public, max-age=3600"; }
location = /claude/sw.js { alias /usr/local/share/claude-code-ttyd/sw.js; default_type application/javascript; add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/claude/"; }
location ^~ /claude/icons/ { alias /usr/local/share/claude-code-ttyd/icons/; add_header Cache-Control "public, max-age=2592000, immutable"; }
location = /claude_auth_check { internal; proxy_pass http://127.0.0.1:7682/check; proxy_pass_request_body off; proxy_set_header Content-Length ""; proxy_set_header Cookie $http_cookie; }
location = /claude_login { rewrite ^ /login break; proxy_pass http://127.0.0.1:7682; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; }
location = /claude_capture { auth_request /claude_auth_check; error_page 401 = @claude_login_redirect; proxy_pass http://127.0.0.1:7683/capture; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; proxy_buffering off; }
location = /claude_send { auth_request /claude_auth_check; error_page 401 = @claude_login_redirect; proxy_pass http://127.0.0.1:7683/send; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; client_max_body_size 200k; }
location = /claude_capture_struct { auth_request /claude_auth_check; error_page 401 = @claude_login_redirect; proxy_pass http://127.0.0.1:7683/capture_struct; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; proxy_buffering off; }
location = /claude_swap_acc { auth_request /claude_auth_check; error_page 401 = @claude_login_redirect; proxy_pass http://127.0.0.1:7683/swap_acc; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; proxy_buffering off; }
location = /claude_swap_acc_all { auth_request /claude_auth_check; error_page 401 = @claude_login_redirect; proxy_pass http://127.0.0.1:7683/swap_acc_all; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 30s; proxy_buffering off; }
location = /claude_acc_status { auth_request /claude_auth_check; error_page 401 = @claude_login_redirect; proxy_pass http://127.0.0.1:7683/acc_status; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; proxy_buffering off; }
location @claude_login_redirect { return 302 /claude_login?next=$request_uri; }
location ^~ /claude/ { auth_request /claude_auth_check; error_page 401 = @claude_login_redirect; proxy_pass http://127.0.0.1:7681; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 86400; proxy_buffering off; }
